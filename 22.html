
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جدول المذاكرة - 22 يوم</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4361ee;
            --secondary: #3a0ca3;
            --accent: #7209b7;
            --light: #f8f9fa;
            --dark: #212529;
            --success: #4cc9f0;
            --warning: #f72585;
            --card-bg: #ffffff;
            --shadow: 0 10px 20px rgba(0, 0, 0, 0.08);
            --gradient: linear-gradient(135deg, #4361ee, #3a0ca3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            color: var(--dark);
            line-height: 1.6;
            min-height: 100vh;
            padding: 20px;
            direction: rtl;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            padding: 20px;
            background: var(--gradient);
            border-radius: 15px;
            color: white;
            box-shadow: var(--shadow);
            position: relative;
            overflow: hidden;
        }

        header::before {
            content: "";
            position: absolute;
            top: 0;
            right: 0;
            width: 100%;
            height: 100%;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 320"><path fill="%23ffffff" fill-opacity="0.1" d="M0,128L48,144C96,160,192,192,288,186.7C384,181,480,139,576,138.7C672,139,768,181,864,181.3C960,181,1056,139,1152,138.7C1248,139,1344,181,1392,202.7L1440,224L1440,320L1392,320C1344,320,1248,320,1152,320C1056,320,960,320,864,320C768,320,672,320,576,320C480,320,384,320,288,320C192,320,96,320,48,320L0,320Z"></path></svg>');
            background-size: cover;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            position: relative;
            text-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }

        .subtitle {
            font-size: 1.2rem;
            opacity: 0.9;
            font-weight: 300;
        }

        .progress-container {
            background-color: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            padding: 15px;
            margin-top: 20px;
            backdrop-filter: blur(5px);
        }

        .progress-bar {
            height: 10px;
            background-color: rgba(255, 255, 255, 0.3);
            border-radius: 5px;
            overflow: hidden;
            margin-bottom: 10px;
        }

        .progress {
            height: 100%;
            background-color: var(--success);
            width: 0%;
            transition: width 0.5s ease;
            border-radius: 5px;
        }

        .progress-text {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
        }

        .days-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 25px;
            margin-bottom: 40px;
        }

        .day {
            background-color: var(--card-bg);
            border-radius: 15px;
            padding: 25px;
            box-shadow: var(--shadow);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            border-top: 5px solid var(--primary);
        }

        .day:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.15);
        }

        .day::before {
            content: "";
            position: absolute;
            top: 0;
            right: 0;
            width: 100%;
            height: 5px;
            background: var(--gradient);
        }

        .day-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.1);
        }

        .day-number {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--primary);
            display: flex;
            align-items: center;
        }

        .day-number::before {
            content: "اليوم";
            font-size: 1rem;
            margin-left: 5px;
            font-weight: 400;
            color: var(--dark);
        }

        .day-icon {
            width: 50px;
            height: 50px;
            background: var(--gradient);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.5rem;
        }

        .subjects {
            list-style-type: none;
            padding: 0;
        }

        .subject {
            padding: 12px 15px;
            margin-bottom: 10px;
            background-color: var(--light);
            border-radius: 10px;
            display: flex;
            align-items: center;
            transition: all 0.2s ease;
            border-right: 4px solid transparent;
        }

        .subject:hover {
            background-color: #e9ecef;
            border-right-color: var(--primary);
            transform: translateX(-5px);
        }

        .subject i {
            margin-left: 10px;
            color: var(--primary);
            font-size: 1.1rem;
        }

        .subject-type {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 5px;
            font-size: 0.8rem;
            margin-right: 8px;
            background-color: var(--primary);
            color: white;
        }

        .subject-type.theory {
            background-color: var(--secondary);
        }

        .subject-type.practical {
            background-color: var(--accent);
        }

        .subject-type.review {
            background-color: var(--success);
        }

        .subject-type.english {
            background-color: var(--warning);
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
        }

        .btn {
            padding: 12px 25px;
            border: none;
            border-radius: 50px;
            font-family: 'Tajawal', sans-serif;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .btn-primary {
            background: var(--gradient);
            color: white;
        }

        .btn-outline {
            background: transparent;
            color: var(--primary);
            border: 2px solid var(--primary);
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 7px 10px rgba(0, 0, 0, 0.15);
        }

        .completed .day-number {
            color: var(--success);
        }

        .completed .subject {
            opacity: 0.7;
            text-decoration: line-through;
        }

        .completed .subject-type {
            opacity: 0.7;
        }

        footer {
            text-align: center;
            padding: 20px;
            margin-top: 40px;
            color: var(--dark);
            opacity: 0.7;
            font-size: 0.9rem;
        }

        @media (max-width: 768px) {
            .days-container {
                grid-template-columns: 1fr;
            }
            
            h1 {
                font-size: 2rem;
            }
            
            .controls {
                flex-direction: column;
                align-items: center;
            }
            
            .btn {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>جدول المذاكرة</h1>
            <p class="subtitle">خطة منظمة لـ 22 يوم لتحقيق أفضل النتائج</p>
            
            <div class="progress-container">
                <div class="progress-bar">
                    <div class="progress" id="progress"></div>
                </div>
                <div class="progress-text">
                    <span>التقدم: <span id="progress-percent">0%</span></span>
                    <span>الأيام المتبقية: <span id="remaining-days">22</span></span>
                </div>
            </div>
        </header>

        <div class="controls">
            <button class="btn btn-primary" id="mark-all">
                <i class="fas fa-check-circle"></i> تعليم الكل كمكتمل
            </button>
            <button class="btn btn-outline" id="reset-all">
                <i class="fas fa-redo"></i> إعادة تعيين
            </button>
        </div>

        <div class="days-container" id="days-container">
            <!-- سيتم إضافة الأيام ديناميكياً -->
        </div>

        <footer>
            <p>تم التصميم بتقنيات حديثة لتجربة مستخدم محسنة - 2023</p>
        </footer>
    </div>

    <script>
        // بيانات الأيام
        const daysData = [
            {
                day: 1,
                subjects: [
                    { name: "Terminology, Hand Hygiene", type: "practical", course: "Fundamental" },
                    { name: "Nursing Professional", type: "theory", course: "Fundamental" },
                    { name: "Introduction", type: "theory", course: "Physiology" }
                ]
            },
            {
                day: 2,
                subjects: [
                    { name: "PPE, Respiration", type: "practical", course: "Fundamental" },
                    { name: "Health and Illness", type: "theory", course: "Fundamental" },
                    { name: "Lecture 1 Nursing", type: "english", course: "English" }
                ]
            },
            {
                day: 3,
                subjects: [
                    { name: "Position, Blood Pressure", type: "practical", course: "Fundamental" },
                    { name: "Patient Safety in Health Care Settings", type: "theory", course: "Fundamental" },
                    { name: "Structure of Bacterial Cell", type: "theory", course: "Microbiology" }
                ]
            },
            {
                day: 4,
                subjects: [
                    { name: "Body Temperature, Body Mechanics", type: "practical", course: "Fundamental" },
                    { name: "Vital Signs Respiration", type: "theory", course: "Fundamental" },
                    { name: "Excitable Tissue", type: "theory", course: "Physiology" }
                ]
            },
            {
                day: 5,
                subjects: [
                    { name: "Pulse Assess, Bed Bath", type: "practical", course: "Fundamental" },
                    { name: "Vital Signs Temperature, Pulse", type: "theory", course: "Fundamental" },
                    { name: "Anatomical Terms", type: "theory", course: "Anatomy" }
                ]
            },
            {
                day: 6,
                subjects: [
                    { name: "Bed Making + مراجعة", type: "practical", course: "Fundamental" },
                    { name: "ANS, Blood 1", type: "theory", course: "Physiology" },
                    { name: "Antimicrobial Chemotherapy", type: "theory", course: "Microbiology" }
                ]
            },
            {
                day: 7,
                subjects: [
                    { name: "تمرين عملي شامل للفاندا + مراجعة", type: "practical", course: "Fundamental" },
                    { name: "Blood 2, LECT", type: "theory", course: "Physiology" },
                    { name: "Skeletal System 1, Skeletal System 2", type: "theory", course: "Anatomy" }
                ]
            },
            {
                day: 8,
                subjects: [
                    { name: "Skin, Fascia & Muscle, Skeletal Muscles & Joints", type: "theory", course: "Anatomy" },
                    { name: "Pain Management", type: "theory", course: "Fundamental" },
                    { name: "Systemic Bacteriology", type: "theory", course: "Microbiology" },
                    { name: "Unit 1 Medical Supplies and Tools", type: "english", course: "English" }
                ]
            },
            {
                day: 9,
                subjects: [
                    { name: "Joints 2 & Respiratory, Cardiovascular System", type: "theory", course: "Anatomy" },
                    { name: "Patient Safety Review", type: "review", course: "Fundamental" },
                    { name: "Introduction to Ethics, Patient Rights & Responsibility", type: "theory", course: "Ethics" }
                ]
            },
            {
                day: 10,
                subjects: [
                    { name: "Digestive & Urinary, Genital & Endocrine", type: "theory", course: "Anatomy" },
                    { name: "Immunity (Innate), Immunology Part II", type: "theory", course: "Microbiology" },
                    { name: "Medical Specialist", type: "english", course: "English" }
                ]
            },
            {
                day: 11,
                subjects: [
                    { name: "Anatomical Terms, Skeletal System & Skeleton", type: "practical", course: "Anatomy" },
                    { name: "Nurses’ Rights & Responsibility, Professional Relationship", type: "theory", course: "Ethics" },
                    { name: "فصل تمهيدي، المفاهيم الأساسية للحق والحرية والقانون", type: "theory", course: "Rights" }
                ]
            },
            {
                day: 12,
                subjects: [
                    { name: "Axial Skeleton, Muscles & Joints I", type: "practical", course: "Anatomy" },
                    { name: "CVS, Respiration", type: "theory", course: "Physiology" },
                    { name: "Bacterial Physiology & Metabolism, Host-Parasite Relationship", type: "theory", course: "Microbiology" }
                ]
            },
            {
                day: 13,
                subjects: [
                    { name: "Joints II & Respiratory System, Heart", type: "practical", course: "Anatomy" },
                    { name: "Vital Signs Review", type: "review", course: "Fundamental" },
                    { name: "Professional Relationship, Legal Aspects of Nursing", type: "theory", course: "Ethics" }
                ]
            },
            {
                day: 14,
                subjects: [
                    { name: "Blood Vessels & Digestive System", type: "practical", course: "Anatomy" },
                    { name: "Review Blood, ANS", type: "review", course: "Physiology" },
                    { name: "Grammar Focus & How to say the Date in English", type: "english", course: "English" }
                ]
            },
            {
                day: 15,
                subjects: [
                    { name: "Virology, HAI, Sterilization & Disinfection", type: "theory", course: "Microbiology" },
                    { name: "2025 Code of Ethics Part 1 & 2", type: "theory", course: "Ethics" },
                    { name: "القانون الدولي لحقوق الإنسان، القانون الدولي الإنساني", type: "theory", course: "Rights" }
                ]
            },
            {
                day: 16,
                subjects: [
                    { name: "Vital Signs + Pain Management Review", type: "review", course: "Fundamental" },
                    { name: "Muscles & Joints Review", type: "review", course: "Anatomy" },
                    { name: "Blood 1 & 2 Review", type: "review", course: "Physiology" }
                ]
            },
            {
                day: 17,
                subjects: [
                    { name: "Review Immunity & Bacterial Physiology", type: "review", course: "Microbiology" },
                    { name: "Grammar Focus Review, Medical Specialists", type: "review", course: "English" },
                    { name: "حقوق وحريات الإنسان في التشريع", type: "theory", course: "Rights" }
                ]
            },
            {
                day: 18,
                subjects: [
                    { name: "تمرين شامل + Bed Bath / Bed Making", type: "practical", course: "Fundamental" },
                    { name: "Legal Aspects Review", type: "review", course: "Ethics" },
                    { name: "CVS & Respiration Review", type: "review", course: "Physiology" }
                ]
            },
            {
                day: 19,
                subjects: [
                    { name: "Heart, Blood Vessels & Digestive System Review", type: "review", course: "Anatomy" },
                    { name: "Patient Safety & Pain Management", type: "theory", course: "Fundamental" },
                    { name: "Sterilization & Disinfection Review", type: "review", course: "Microbiology" }
                ]
            },
            {
                day: 20,
                subjects: [
                    { name: "Grammar Focus, Medical Tools & Specialists Review", type: "review", course: "English" },
                    { name: "ضمانات الحقوق والحريات، الشفافية ومكافحة الفساد", type: "theory", course: "Rights" },
                    { name: "Code of Ethics Review", type: "review", course: "Ethics" }
                ]
            },
            {
                day: 21,
                subjects: [
                    { name: "Full Review (Introduction to Respiration & CVS)", type: "review", course: "Physiology" },
                    { name: "Full Practical Review", type: "review", course: "Fundamental" },
                    { name: "All Systems Overview", type: "review", course: "Anatomy" }
                ]
            },
            {
                day: 22,
                subjects: [
                    { name: "Full Review", type: "review", course: "Microbiology" },
                    { name: "Full Review", type: "review", course: "Fundamental" },
                    { name: "Final Review", type: "review", course: "English, Rights & Ethics" }
                ]
            }
        ];

        // رموز أيقونات لكل مادة
        const courseIcons = {
            "Fundamental": "fa-user-nurse",
            "Physiology": "fa-heartbeat",
            "English": "fa-language",
            "Microbiology": "fa-microscope",
            "Anatomy": "fa-bone",
            "Ethics": "fa-balance-scale",
            "Rights": "fa-gavel"
        };

        // إنشاء الأيام في الصفحة
        const daysContainer = document.getElementById('days-container');
        
        daysData.forEach(dayData => {
            const dayElement = document.createElement('div');
            dayElement.className = 'day';
            dayElement.dataset.day = dayData.day;
            
            let subjectsHTML = '';
            dayData.subjects.forEach(subject => {
                const iconClass = courseIcons[subject.course] || 'fa-book';
                subjectsHTML += `
                    <li class="subject">
                        <i class="fas ${iconClass}"></i>
                        <span class="subject-type ${subject.type}">${getTypeText(subject.type)}</span>
                        <span><strong>${subject.course}:</strong> ${subject.name}</span>
                    </li>
                `;
            });
            
            dayElement.innerHTML = `
                <div class="day-header">
                    <div class="day-number">${dayData.day}</div>
                    <div class="day-icon">
                        <i class="fas fa-calendar-day"></i>
                    </div>
                </div>
                <ul class="subjects">
                    ${subjectsHTML}
                </ul>
            `;
            
            daysContainer.appendChild(dayElement);
            
            // إضافة حدث النقر لتعليم اليوم كمكتمل
            dayElement.addEventListener('click', function() {
                this.classList.toggle('completed');
                updateProgress();
            });
        });

        // وظيفة للحصول على نص النوع بالعربية
        function getTypeText(type) {
            const typeTexts = {
                "theory": "نظري",
                "practical": "عملي",
                "review": "مراجعة",
                "english": "إنجليزي"
            };
            return typeTexts[type] || type;
        }

        // تحديث شريط التقدم
        function updateProgress() {
            const completedDays = document.querySelectorAll('.day.completed').length;
            const totalDays = daysData.length;
            const progressPercent = Math.round((completedDays / totalDays) * 100);
            const remainingDays = totalDays - completedDays;
            
            document.getElementById('progress').style.width = `${progressPercent}%`;
            document.getElementById('progress-percent').textContent = `${progressPercent}%`;
            document.getElementById('remaining-days').textContent = remainingDays;
        }

        // تعليم جميع الأيام كمكتملة
        document.getElementById('mark-all').addEventListener('click', function() {
            document.querySelectorAll('.day').forEach(day => {
                day.classList.add('completed');
            });
            updateProgress();
        });

        // إعادة تعيين جميع الأيام
        document.getElementById('reset-all').addEventListener('click', function() {
            document.querySelectorAll('.day').forEach(day => {
                day.classList.remove('completed');
            });
            updateProgress();
        });

        // تحديث التقدم عند التحميل
        updateProgress();
    </script>
</body>
</html>
